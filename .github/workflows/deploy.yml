name: Deploy

# Atualiza o Droplet para uma versão já publicada pelo workflow Release, com o
# deploy/update.sh dessa versão: backup, imagens novas, /health e, se algo
# falhar, volta para a versão anterior.
#
# Roda sozinho no fim do Release (a cada tag vX.Y.Z). À mão (Actions → Deploy →
# Run workflow), serve para reinstalar uma versão ou voltar para uma anterior.
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         IP ou nome do Droplet
#   DEPLOY_USER         usuário SSH (ex.: deploy), no grupo docker
#   DEPLOY_SSH_KEY      chave privada SSH (a pública vai no ~/.ssh/authorized_keys do Droplet)
#   DEPLOY_KNOWN_HOSTS  opcional: saída de `ssh-keyscan <DEPLOY_HOST>`; sem ela, o
#                       host é aceito no primeiro contato (menos seguro)
#   DEPLOY_PATH         opcional: pasta do clone no Droplet (padrão: ~/meu-caixa)
# Sem DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY o workflow só avisa e termina sem erro.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão publicada (tag), ex. v1.1.0
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  # Baixar as imagens do ghcr.io no Droplet, se forem privadas.
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      VERSION: ${{ inputs.version }}
      GHCR_TOKEN: ${{ github.token }}
      GHCR_USER: ${{ github.actor }}
    steps:
      - name: Conferir segredos
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Segredos DEPLOY_HOST, DEPLOY_USER e DEPLOY_SSH_KEY não configurados; nada a fazer."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "STRICT=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS não configurado; aceitando a chave do host no primeiro contato."
            echo "STRICT=accept-new" >> "$GITHUB_ENV"
          fi

      - name: Atualizar o Droplet
        if: steps.check.outputs.ready == 'true'
        run: |
          if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::versão inválida: $VERSION (use a tag de uma release, ex. v1.1.0)"
            exit 1
          fi
          # Caminho relativo = a partir do home do usuário no Droplet.
          DIR=${DEPLOY_PATH:-meu-caixa}
          droplet() {
            ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking="$STRICT" -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" "$@"
          }

          # Login no ghcr.io só durante o deploy: o token do job expira quando ele acaba.
          printf '%s' "$GHCR_TOKEN" | droplet "docker login ghcr.io -u '$GHCR_USER' --password-stdin" > /dev/null
          trap 'droplet "docker logout ghcr.io" > /dev/null || true' EXIT

          # Roda o update.sh da versão de destino (o clone pode estar numa versão
          # anterior a ele).
          droplet "set -e
            cd '$DIR'
            git fetch --quiet --tags --force origin
            git show 'refs/tags/$VERSION:deploy/update.sh' > /tmp/meu-caixa-update.sh
            DEPLOY_DIR=\"\$PWD/deploy\" UPDATE_SCRIPT_VERSION='$VERSION' bash /tmp/meu-caixa-update.sh '$VERSION'"
