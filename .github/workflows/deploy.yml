name: Deploy

# Só manual (Actions → Deploy → Run workflow). Nunca roda em push.
# Faz no Droplet o mesmo que o passo "Atualizar" do docs/deploy.md:
# git pull + docker compose up -d --build.
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST         IP ou nome do Droplet
#   DEPLOY_USER         usuário SSH (ex.: deploy), no grupo docker
#   DEPLOY_SSH_KEY      chave privada SSH (a pública vai no ~/.ssh/authorized_keys do Droplet)
#   DEPLOY_KNOWN_HOSTS  opcional: saída de `ssh-keyscan <DEPLOY_HOST>`; sem ela, o
#                       host é aceito no primeiro contato (menos seguro)
#   DEPLOY_PATH         opcional: pasta do clone no Droplet (padrão: ~/meu-caixa)
# Sem DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY o workflow só avisa e termina sem erro.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch a publicar
        required: true
        default: main

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      REF: ${{ inputs.ref }}
    steps:
      - name: Conferir segredos
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Segredos DEPLOY_HOST, DEPLOY_USER e DEPLOY_SSH_KEY não configurados; nada a fazer."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "STRICT=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS não configurado; aceitando a chave do host no primeiro contato."
            echo "STRICT=accept-new" >> "$GITHUB_ENV"
          fi

      - name: Atualizar o Droplet
        if: steps.check.outputs.ready == 'true'
        run: |
          case "$REF" in
            "" | -* | *[!A-Za-z0-9._/-]*) echo "::error::branch inválida: $REF"; exit 1 ;;
          esac
          # Caminho relativo = a partir do home do usuário no Droplet.
          DIR=${DEPLOY_PATH:-meu-caixa}
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking="$STRICT" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e
             cd '$DIR'
             git fetch --prune origin
             # O clone do Droplet só acompanha o GitHub: fica igual a origin/<branch>.
             git checkout --quiet -B '$REF' 'origin/$REF'
             cd deploy
             docker compose up -d --build --wait --wait-timeout 600
             docker image prune -f
             docker compose ps"
