name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meu_caixa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/meu_caixa_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter api lint
      - name: Formatação
        run: pnpm --filter api format:check
      - name: Typecheck
        run: pnpm --filter api typecheck
      - name: Build
        run: pnpm --filter api build
      - name: Testes unitários
        run: pnpm --filter api test
      - name: Testes e2e (Postgres)
        run: pnpm --filter api test:e2e
      - name: Migrations em dia com o schema
        run: |
          pnpm --filter api db:generate
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "::error::O schema mudou sem migration. Rode 'pnpm --filter api db:generate' e commite."
            git status --porcelain apps/api/drizzle
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter web lint
      - name: Typecheck
        run: pnpm --filter web exec next typegen && pnpm --filter web typecheck
      - name: Testes unitários
        run: pnpm --filter web test
      - name: Build
        run: pnpm --filter web build

  # Constrói as imagens de produção (sem publicar) para pegar Dockerfile quebrado.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: meu-caixa-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Imagem da interface
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: meu-caixa-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Imagem do Keycloak
        uses: docker/build-push-action@v6
        with:
          context: deploy/keycloak
          push: false
          tags: meu-caixa-keycloak:ci
      - name: Compose de produção válido
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config -q
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml config -q
