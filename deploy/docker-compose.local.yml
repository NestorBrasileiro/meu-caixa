# Teste local do compose de produção (não use no Droplet). Sobe a mesma pilha
# com HTTPS da CA interna do Caddy em https://meucaixa.localhost:8443, dados
# fictícios (FINANCE_PROVIDER=fake) e um usuário de teste no Keycloak
# (teste / teste-local-123). O jeito mais fácil é o script:
#
#   deploy/smoke-local.sh          # sobe, testa e derruba (apaga os volumes)
#
# Ou, à mão (o .env.local é gerado pelo script na primeira execução):
#
#   cd deploy
#   docker compose -p meu-caixa-local -f docker-compose.yml -f docker-compose.local.yml \
#     --env-file .env.local up -d --build
#
# Portas usadas no host: 8443 (HTTPS) e 8180 (console do Keycloak), só em 127.0.0.1.
services:
  keycloak:
    volumes:
      # Usuário de teste com a role "owner" (importado junto com o realm).
      - ./keycloak/local/meu-caixa-users-0.json:/opt/keycloak/data/import/meu-caixa-users-0.json:ro

  api:
    environment:
      FINANCE_PROVIDER: fake
      # A API fala com o Keycloak por https://AUTH_DOMAIN (via Caddy); aqui o
      # certificado é da CA interna do Caddy, então a API passa a confiar nela.
      NODE_EXTRA_CA_CERTS: /local-ca/root.crt
    volumes:
      - local_ca:/local-ca:ro
    depends_on:
      caddy-ca:
        condition: service_completed_successfully

  # Copia o certificado raiz da CA interna do Caddy (pasta só do root) para um
  # volume legível pela API, que roda sem privilégios.
  caddy-ca:
    image: caddy:2.10-alpine
    command:
      - sh
      - -c
      - >-
        until [ -f /data/caddy/pki/authorities/local/root.crt ]; do sleep 1; done;
        cp /data/caddy/pki/authorities/local/root.crt /ca/root.crt && chmod 644 /ca/root.crt
    volumes:
      - caddy_data:/data:ro
      - local_ca:/ca
    network_mode: none
    depends_on:
      caddy:
        condition: service_started

  caddy:
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile.local', '--adapter', 'caddyfile']
    ports: !override
      - '127.0.0.1:8443:8443'
    networks: !override
      edge:
        # Sem a porta: o alias é só o nome do host.
        aliases:
          - ${AUTH_HOST:-auth.meucaixa.localhost}
    # Sem esperar web/api: a API precisa da CA do Caddy já criada ao subir.
    depends_on: !reset {}

volumes:
  local_ca:
