# Só a aplicação (API + interface), a partir das imagens publicadas no GHCR.
# Para quando Postgres, Keycloak e o proxy HTTPS (nginx etc.) já existem fora
# desta pilha. Passo a passo em docs/deploy.md ("Só a aplicação").
#
# No servidor bastam este arquivo e o .env, sem clonar o repositório:
#
#   docker compose -f docker-compose.app.yml pull
#   docker compose -f docker-compose.app.yml up -d
#
# As portas ficam em 127.0.0.1 para o proxy do mesmo servidor. Se o proxy
# estiver em outra máquina, troque APP_BIND pelo IP privado deste servidor.
name: meu-caixa

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  api:
    image: ghcr.io/nestorbrasileiro/meu-caixa-api:${MEU_CAIXA_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL no .env}
      DATABASE_MIGRATE_ON_START: 'true'
      APP_URL: https://${DOMAIN:?defina DOMAIN no .env}
      FRONTEND_URL: https://${DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no .env}
      # Endereço público do Keycloak: precisa bater com o "issuer" dos tokens.
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://${AUTH_DOMAIN}}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-meu-caixa}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?defina KEYCLOAK_CLIENT_SECRET no .env}
      KEYCLOAK_REQUIRED_ROLE: ${KEYCLOAK_REQUIRED_ROLE:-owner}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      FINANCE_PROVIDER: ${FINANCE_PROVIDER:-pluggy}
      # Pluggy e Anthropic ficam no banco (tela Configurações), cifradas com esta chave.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-6}
      # MCP (opcional). Chave da Anthropic e token do MCP ficam no banco, por usuário.
      MCP_ALLOWED_CLIENTS: ${MCP_ALLOWED_CLIENTS:-}
    ports:
      # /mcp, /health e /.well-known/oauth-protected-resource vêm direto para cá.
      - '${APP_BIND:-127.0.0.1}:${API_PORT:-3000}:3000'
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *logging

  web:
    # A imagem já vem com o proxy de /api e /auth apontando para http://api:3000.
    image: ghcr.io/nestorbrasileiro/meu-caixa-web:${MEU_CAIXA_TAG:-latest}
    restart: unless-stopped
    environment:
      DATA_SOURCE: api
      API_URL: http://api:3000
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
    ports:
      - '${APP_BIND:-127.0.0.1}:${WEB_PORT:-3001}:3000'
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *logging
