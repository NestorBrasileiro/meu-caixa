# Produção num único Droplet da DigitalOcean (passo a passo em docs/deploy.md).
#
#   cd deploy
#   cp .env.example .env   # e preencha
#   docker compose up -d   # imagens publicadas (APP_VERSION); ou --build para gerar aqui
#
# Só o Caddy publica portas na internet (80/443). Postgres, API e interface
# ficam nas redes internas do Docker. O login é um Keycloak que já existe
# (KEYCLOAK_URL). Pelo COMPOSE_FILE do .env dá para somar o
# docker-compose.keycloak.yml (Keycloak aqui mesmo) ou o
# docker-compose.external-db.yml (Postgres em outro Droplet).
name: meu-caixa

# Imagens: as publicadas pelo workflow Release (ghcr.io) a cada tag v*, na
# versão APP_VERSION do .env (o deploy/update.sh troca essa linha). Com
# `docker compose up -d --build`, são geradas aqui mesmo com o mesmo nome.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no deploy/.env}
      # Usado só pelo postgres/init.sh, na primeira subida (volume vazio).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    networks: [backend]
    healthcheck:
      # Por TCP: durante a inicialização o Postgres só escuta no socket local.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d meu_caixa']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    image: ${IMAGE_PREFIX:-ghcr.io/nestorbrasileiro/meu-caixa}-api:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Banco local (serviço postgres) ou, com o docker-compose.external-db.yml, o
      # de outro Droplet: DATABASE_HOST (IP privado) ou um DATABASE_URL completo.
      DATABASE_URL: ${DATABASE_URL:-postgres://meu_caixa:${APP_DB_PASSWORD}@${DATABASE_HOST:-postgres}:5432/meu_caixa}
      DATABASE_MIGRATE_ON_START: 'true'
      # O browser chega na API pela interface (proxy de /api e /auth do Next).
      APP_URL: https://${DOMAIN}
      FRONTEND_URL: https://${DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET:?defina SESSION_SECRET no deploy/.env}
      # Mesmo endereço que o browser vê, para o issuer dos tokens bater.
      KEYCLOAK_URL: ${KEYCLOAK_URL:?defina KEYCLOAK_URL no deploy/.env}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-meu-caixa}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?defina KEYCLOAK_CLIENT_SECRET no deploy/.env}
      KEYCLOAK_REQUIRED_ROLE: ${KEYCLOAK_REQUIRED_ROLE:-owner}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
      FINANCE_PROVIDER: ${FINANCE_PROVIDER:-pluggy}
      # Pluggy e Anthropic ficam no banco (tela Configurações), cifradas com esta chave.
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-6}
      # MCP (opcional). Chave da Anthropic e token do MCP ficam no banco, por usuário.
      MCP_ALLOWED_CLIENTS: ${MCP_ALLOWED_CLIENTS:-}
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        # Gravado no build: destino do proxy de /api e /auth (rewrites do Next).
        API_URL: http://api:3000
    image: ${IMAGE_PREFIX:-ghcr.io/nestorbrasileiro/meu-caixa}-web:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      DATA_SOURCE: api
      API_URL: http://api:3000
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no deploy/.env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging

networks:
  # Caddy, interface e API (e o Keycloak, se rodar aqui).
  edge:
  # Postgres e quem fala com ele. Interna: o Postgres não tem rota para a
  # internet; a API sai pela rede edge.
  backend:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
